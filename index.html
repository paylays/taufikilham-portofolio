<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taufik Ilham | Full-Stack Developer</title>
    <meta
      name="description"
      content="Taufik Ilham, full-stack developer in Balikpapan, Indonesia. Projects, experience, education and contact."
    />

    <!-- Apply the saved or system theme before first paint so dark-mode visitors see no white flash -->
    <script>
      try {
        var saved = localStorage.getItem('theme-preference');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
